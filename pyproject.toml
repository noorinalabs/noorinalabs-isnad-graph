[project]
name = "isnad-graph"
version = "0.1.0"
description = "Computational hadith analysis platform with Neo4j graph database for isnad chain analysis"
license = {text = "Apache-2.0"}
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "neo4j>=5.15",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "starlette>=1.3.1",  # CVE-2026-54283 (urlencoded-form DoS) + CVE-2026-54282 (request.url host spoof)
    "uvicorn[standard]>=0.34",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf (statically-linked OpenSSL in wheels); transitive via python-jose/authlib
    "redis>=5.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

# Optional ML runtime for the production semantic-embedding load only. NOT a
# runtime dependency of the API (the lean API image stays torch-free) — it is
# installed only in the dedicated embed image (`uv sync --extra ml`, Dockerfile
# `embed` target) so `SentenceTransformerEmbedder` can load a real model on the
# cluster (P5W4 / #1071). `paraphrase-multilingual-MiniLM-L12-v2` is 384-dim,
# matching `EMBEDDING_DIM` and the `vector(384)` column. See src/enrich/embeddings.py.
[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "sentence-transformers>=2.2",
]

[project.scripts]
isnad = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-tqdm>=4.66",
    "types-pyyaml>=6.0.12.20250915",
    "testcontainers[neo4j,postgres,redis]>=4.0",
    "hypothesis>=6.0",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
    "pytest-rerunfailures>=14.0",
    "pip-audit>=2.7",
    "types-psycopg2>=2.9.21.20260223",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"  # ruff doesn't support py314 yet; py313 is the closest
# Worktree dirs are scratch checkouts of other branches — never lint/format these.
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PD"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator", "prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

# Optional ML extra (production embedding load only); not a runtime dependency,
# so its stubs are never installed in CI. See src/enrich/embeddings.py.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_uninitialized = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests requiring Docker containers (Neo4j, PostgreSQL, Redis)",
    "e2e: marks browser automation tests requiring running frontend and backend",
]
