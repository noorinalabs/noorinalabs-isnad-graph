# Pre-commit hooks for isnad-graph
# Install:  make hooks   (or: pre-commit install --hook-type pre-commit \
#                              --hook-type commit-msg --hook-type pre-push)
# Docs:     https://pre-commit.com/
#
# This MIRRORS .github/workflows/ci.yml + docs.yml so local commits/pushes fail
# fast instead of surfacing a lint/type/test/actionlint/build error only after a
# PR is opened (Phase-3 end-state criterion #6 / #327). The kind-level mirror
# (ruff, mypy, pytest, eslint, typescript, gitleaks, pip-audit, actionlint,
# build, cspell present on both sides) is enforced in CI by `.claude/lib/
# pre_commit_ci_sync.py` — if a future edit drops a check from one side, the
# "Pre-commit <-> CI sync-drift gate" job in docs.yml fails the build.
#
# Stage split (fail-fast, cheapest first):
#   pre-commit (every commit) — ruff-format, ruff-lint, gitleaks, actionlint,
#     cspell, pip-audit, mypy, unit tests, ESLint, frontend type-check. Fast
#     checks that catch the most common defects before a commit is recorded.
#   commit-msg               — co-author trailer enforcement.
#   pre-push  (every push)   — frontend build. The heavier compile that mirrors
#     ci.yml's `npm run build`; run before code leaves the machine, not on every
#     commit, to keep the commit loop snappy.
#
# Prerequisites:
#   - Python 3.14+ with uv
#   - Node.js 22+ with npm (run `cd frontend && npm install` once)
#   - gitleaks CLI: https://github.com/gitleaks/gitleaks#installing

repos:
  # --- Ruff formatter & linter (commit stage) ---
  # ruff-format runs first so format fixes don't trigger re-lint.
  # `.claude/worktrees/` is excluded because it contains scratch checkouts of
  # other branches; reformatting them would silently overwrite work in progress.
  # Keep `rev` in sync with `uv.lock` (currently ruff 0.15.x) AND with the
  # `uvx ruff@<version>` calls in `.github/workflows/ci.yml` so the same
  # ruff is used everywhere — local pre-commit, scripts-lint CI, hooks-lint CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
        name: ruff-format
        exclude: ^\.claude/worktrees/
      - id: ruff
        args: [--fix]
        name: ruff-lint
        exclude: ^\.claude/worktrees/

  # --- Secret detection (commit stage) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        name: gitleaks

  # --- Workflow lint (commit stage) — mirrors docs.yml actionlint job (#327) ---
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-commit]

  # --- Spellcheck (commit stage) — mirrors docs.yml Spellcheck (cspell) job ---
  # Closes the spell-check blind spot (noorinalabs-main#684): CI's
  # `streetsidesoftware/cspell-action@…v8.4.0` enforced cspell with no local
  # mirror, so new authored-prose typos failed only after push. The
  # `Pre-commit ⇄ CI sync-drift gate` now classifies the `cspell` kind and
  # DEMANDS this mirror.
  #
  # Pinned to v8.4.0 of cspell-cli to match the exact cspell the
  # `cspell-action@…v8.4.0` CI step bundles — same engine + dictionaries on both
  # sides, so a word that passes locally passes in CI and vice-versa.
  # `language: node`, so pre-commit provisions its own node/cspell env (no system
  # cspell required). `--config .cspell.json` reuses the same dictionaries +
  # ignore rules CI loads; `files` is the regex equivalent of the CI action's
  # authored-prose glob set (CLAUDE.md, README.md, docs, skills, charter).
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.4.0
    hooks:
      - id: cspell
        name: cspell
        args: ["--no-must-find-files", "--no-progress", "--no-summary", "--config", ".cspell.json"]
        files: ^(CLAUDE\.md|README\.md|docs/.*\.md|\.claude/skills/.*\.md|\.claude/team/charter\.md)$
        stages: [pre-commit]

  # --- Branch & commit identity checks ---
  - repo: local
    hooks:
      - id: branch-ownership
        name: branch-ownership
        entry: .githooks/pre-commit
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: co-authored-by-trailers
        name: co-authored-by-trailers
        entry: .githooks/commit-msg
        language: script
        pass_filenames: true
        stages: [commit-msg]

  # --- Local hooks (pip-audit, mypy, tests) ---
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: bash -c 'uv export --no-hashes --frozen --no-emit-project > /tmp/requirements.txt && uv run pip-audit --strict --desc -r /tmp/requirements.txt --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-25645'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: pytest-unit
        name: pytest-unit
        entry: bash -c 'ENVIRONMENT=test uv run pytest tests/ -x --tb=short -q -m "not integration and not e2e and not ml"'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Integration tests require Docker (Neo4j, PostgreSQL) — run in CI only.
      # To run locally: make infra && ENVIRONMENT=test uv run pytest tests/integration/ -m integration

      # Grade-vocab single-source-of-truth gate (ig#1054). Mirrors the
      # "Check grade-vocab drift" step in ci.yml's lint-and-typecheck job: fails
      # if frontend/src/lib/grade-vocab.generated.json has drifted from the
      # backend GRADE_LABELS. Regenerate with `uv run python
      # scripts/emit_grade_vocab.py emit` and commit the result.
      - id: grade-vocab-drift
        name: grade-vocab-drift
        entry: uv run python scripts/emit_grade_vocab.py check
        language: system
        pass_filenames: false
        files: ^(src/utils/grades\.py|scripts/emit_grade_vocab\.py|frontend/src/lib/grade-vocab\.generated\.json)$
        stages: [pre-commit]

  # --- Lockfile validation ---
  - repo: local
    hooks:
      - id: lockfile-no-local-paths
        name: lockfile-no-local-paths
        entry: scripts/lockfile_no_local_paths.sh
        language: system
        pass_filenames: false
        files: ^frontend/package-lock\.json$
        stages: [pre-commit]

  # --- Frontend (React/TypeScript) ---
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend-eslint
        entry: bash -c 'cd frontend && npx eslint src/'
        language: system
        pass_filenames: false
        files: ^frontend/
        types_or: [ts, tsx, javascript, jsx]
        stages: [pre-commit]

      - id: frontend-typecheck
        name: frontend-typecheck
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/
        types_or: [ts, tsx]
        stages: [pre-commit]

      # Push stage: the heavier frontend production build. Mirrors ci.yml's
      # `npm run build`; run before code leaves the machine (not on every commit)
      # to keep the commit loop snappy. Required so the #327 sync-drift gate sees
      # the `build` kind mirrored locally.
      - id: frontend-build
        name: frontend-build (pre-push)
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
