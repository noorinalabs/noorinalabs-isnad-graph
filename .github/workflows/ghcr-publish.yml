# Publish container images to GitHub Container Registry (GHCR).
#
# Triggers:
#   - push to main (every merge republishes :latest + :sha-<sha>)
#   - tag push matching v* or phase*-wave* patterns
#   - workflow_dispatch (manual)
#
# Publishes two images in parallel via matrix:
#   - ghcr.io/noorinalabs/noorinalabs-isnad-graph           (api)
#   - ghcr.io/noorinalabs/noorinalabs-isnad-graph-frontend  (frontend)
#
# Notify-deploy (formerly notify-deploy.yml) is folded into this workflow as a
# dependent job so deploy only fires after BOTH images are published successfully.
# This closes the race condition where the previous standalone notify-deploy
# workflow dispatched noorinalabs-deploy on every push-to-main without waiting
# for publish. See isnad-graph#817 and main#145.
#
# The frontend build resolves @noorinalabs/design-system from GitHub Packages
# (npm.pkg.github.com), pinned in frontend/package-lock.json to a registry
# version. The Dockerfile's `npm ci` reads the read-token from a BuildKit
# secret (id=node_auth_token); we source that secret from GITHUB_TOKEN
# (packages:read) below. This replaced the legacy build-time tarball staging
# (check out design-system @ vX, npm pack, drop the .tgz into ./frontend/) once
# the lockfile moved to the registry version — see #940 and design-system#57.

name: Publish to GHCR

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "phase*-wave*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: noorinalabs/noorinalabs-isnad-graph
            context: .
            dockerfile: Dockerfile
            # API is python/uv — cheap multi-arch, keep amd64+arm64 for future
            # ARM worker nodes (see isnad-graph#817 side-effect #4).
            platforms: linux/amd64,linux/arm64
          - component: frontend
            image: noorinalabs/noorinalabs-isnad-graph-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            # Frontend is amd64-only: the VPS is amd64, and a cross-arch npm-ci
            # build through QEMU is ~10x slower with no production consumer of
            # arm64 today. Re-enable arm64 when Phase 3 introduces ARM nodes.
            platforms: linux/amd64
    steps:
      - name: Checkout (isnad-graph)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up QEMU (multi-arch)
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # Tag scheme (isnad-graph#815 Contract v5 = option C, 2026-04-23):
          #   sha-<short>   — immutable, one per push; written here on every event
          #   latest        — mutable pointer; written here on main + semver tags
          #   stg-<short>   — immutable per-push, stg namespace; written here ONLY
          #                   on push to main. Tag history = stg deploy log.
          #   stg-latest    — moving pointer to most-recent stg-<short>; written
          #                   here ONLY on push to main. Consumers pull this for
          #                   a stable target without chasing SHAs.
          #   prod-<short>  — immutable per-promotion, prod namespace; written by
          #                   deploy#84 ONLY, NOT this file. Tag history = promotion log.
          #   prod-latest   — moving pointer; written by deploy#84 ONLY.
          # deploy#84 writes both prod-* tags in one `docker buildx imagetools
          # create` invocation — registry-side manifest rewrite, no rebuild.
          tags: |
            # Git tag (e.g., v1.2.3 or phase12-wave1)
            type=ref,event=tag
            # Short SHA (e.g., sha-a1b2c3d) on every event — IMMUTABLE anchor
            type=sha,prefix=sha-,format=short
            # Latest on main-branch push or semver tags
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # stg-<short> per-push in stg namespace — IMMUTABLE, push-to-main only
            type=sha,prefix=stg-,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            # stg-latest moving pointer — push-to-main only
            type=raw,value=stg-latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-component cache scopes so api and frontend don't evict each
          # other's layers during parallel matrix builds.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # BuildKit secret consumed by the frontend Dockerfile's `npm ci`
          # (RUN --mount=type=secret,id=node_auth_token) to read
          # @noorinalabs/design-system from GitHub Packages. GITHUB_TOKEN has
          # packages:read (this workflow grants packages:write). Secret-mounted,
          # never a build-arg/layer, so it is not baked into the image. The API
          # build does not mount it, so passing it there is a harmless no-op. #940
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          # Scan by digest — guaranteed to exist immediately after push and
          # immune to tag-resolution races. metadata-action emits :latest,
          # :sha-*, and (on main) :stg-* + :stg-latest — never :main.
          # Digest is the one stable handle across all of them. See
          # user-service#61 retro.
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Summary
        if: always()
        run: |
          echo "## GHCR Publish (${{ matrix.component }}): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** ${{ env.REGISTRY }}/${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platforms:** ${{ matrix.platforms }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # Fire repository_dispatch to noorinalabs-deploy AFTER both images published.
  # Gated to main-branch pushes only — tag pushes and manual dispatches do NOT
  # auto-deploy. This replaces the standalone notify-deploy.yml workflow which
  # fired on every push-to-main without waiting for publish (race condition).
  notify-deploy:
    name: Notify deploy repo
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger deploy repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_REPO_PAT }}
          repository: noorinalabs/noorinalabs-deploy
          event-type: deploy-noorinalabs-isnad-graph
          client-payload: >-
            {
              "repo": "noorinalabs-isnad-graph",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}"
            }
