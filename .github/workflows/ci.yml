name: CI
on:
  pull_request:
    branches: [main, 'deployments/**']
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync
      - name: Check for known vulnerabilities
        run: |
          uv export --no-hashes --frozen --no-emit-project > /tmp/requirements.txt
          uv run pip-audit --strict --desc -r /tmp/requirements.txt --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-25645
      - name: Secret detection with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync
      - run: uv run pytest tests/ -v --tb=short -x -m "not integration and not e2e" --cov=src --cov-report=xml --cov-report=term --cov-fail-under=70
        env:
          ENVIRONMENT: test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  frontend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@noorinalabs"
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npx eslint src/
      - run: npx tsc --noEmit
      - run: npx vitest run

  # IMPORTANT: keep `RUFF_VERSION` below in sync with `rev:` in
  # `.pre-commit-config.yaml` so local pre-commit and CI agree on which
  # ruff (and thus which lint rules) to enforce. Drift between the two
  # caused all `scripts-lint` runs to fail on `main` while `pre-commit`
  # passed locally — see noorinalabs/noorinalabs-isnad-graph#809.
  hooks-lint:
    runs-on: ubuntu-latest
    env:
      RUFF_VERSION: "0.15.11"
    steps:
      - uses: actions/checkout@v6
      # Post-#263 (parent-canonical hook paths) `.claude/hooks/` is empty in
      # this child repo — shared hook source lives in `noorinalabs-main`.
      # Guard the lint steps so the job no-ops cleanly until any
      # isnad-graph-specific hook lands here.
      - id: probe
        run: |
          if [ -d .claude/hooks ] && [ -n "$(find .claude/hooks -type f -name '*.py' -print -quit 2>/dev/null)" ]; then
            echo "has_hooks=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_hooks=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .py files under .claude/hooks/ — skipping ruff (post-#263 child-repo state)."
          fi
      - if: steps.probe.outputs.has_hooks == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - if: steps.probe.outputs.has_hooks == 'true'
        run: uvx ruff@${{ env.RUFF_VERSION }} check .claude/hooks/
      - if: steps.probe.outputs.has_hooks == 'true'
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .claude/hooks/

  scripts-lint:
    runs-on: ubuntu-latest
    env:
      RUFF_VERSION: "0.15.11"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uvx ruff@${{ env.RUFF_VERSION }} check scripts/
      - run: uvx ruff@${{ env.RUFF_VERSION }} format --check scripts/

  lockfile-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check package-lock.json for local paths
        run: |
          if grep -qE '"resolved":\s*"file://((/tmp/|/home/|/Users/|/var/))' frontend/package-lock.json; then
            echo "::error::package-lock.json contains absolute local paths that break CI"
            grep -nE '"resolved":\s*"file://((/tmp/|/home/|/Users/|/var/))' frontend/package-lock.json | head -10
            exit 1
          fi
          echo "No local paths found in package-lock.json"

  e2e:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@noorinalabs"
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: npx vite preview --port 4173 &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:4173 > /dev/null && exit 0
            sleep 1
          done
          echo "Server failed to start" && exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
